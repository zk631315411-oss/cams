# This file is generated with absolute paths by scripts/macos/首次配置并连接Codex.command.
# Keep it under the installed CAMS project as .codex/config.toml; do not add it to ~/.codex/config.toml.

[mcp_servers.cams_workbench]
command = "/Users/<user>/CAMS考试工作台/runtime/python/bin/python3"
args = ["/Users/<user>/CAMS考试工作台/backend/mcp_server.py", "--workspace-root", "/Users/<user>/CAMS考试工作台"]
env = { CAMS_WORKSPACE_ROOT = "/Users/<user>/CAMS考试工作台", CAMS_BGE_MODEL_PATH = "/Users/<user>/CAMS考试工作台/runtime/models/bge-m3" }
